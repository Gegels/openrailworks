# OpenRailWorks user config (launcher + CLI)
# Linux/macOS: ~/.config/openrailworks/config.toml
# Windows:     %APPDATA%\openrailworks\config.toml

railworks_path = "/path/to/Steam/steamapps/common/RailWorks"

update_channel = "stable"   # stable | beta
graphics_profile = "vanilla" # vanilla | enhanced

target_fps = 60
display_width = 1920
display_height = 1080

favorite_routes = ["YourRouteId"]
